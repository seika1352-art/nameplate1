<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント用デジタルネームプレート</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', 'M PLUS Rounded 1c', sans-serif;
            background-color: #080c14;
            color: #f8fafc;
        }

        /* ネームプレート用ガラスモーフィズム */
        .glass-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.15);
        }

        /* ネームプレートのネオン発光アニメーション */
        .card-glow {
            box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.35);
        }

        /* 確定時の更新アニメーション */
        @keyframes card-pulse {
            0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            50% { transform: scale(1.02); box-shadow: 0 0 30px 10px rgba(99, 102, 241, 0.5); }
            100% { transform: scale(1); box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.35); }
        }
        .animate-card-update {
            animation: card-pulse 0.45s ease-out;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-indigo-500 selection:text-white pb-10">

    <!-- ヘッダー -->
    <header id="app-header" class="w-full border-b border-slate-800/80 bg-slate-900/90 backdrop-blur px-4 sm:px-6 py-4 transition-all duration-300 sticky top-0 z-20">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i data-lucide="id-card" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-black text-base sm:text-lg text-slate-100 flex items-center gap-2 tracking-wide">
                        デジタルネームプレート
                    </h1>
                    <p class="text-xs text-slate-400">リアルタイム名前変更 & 交流会掲示機能</p>
                </div>
            </div>

            <!-- ヘッダー全画面ボタン -->
            <button id="btn-fullscreen-header" type="button" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold text-xs sm:text-sm px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-lg shadow-indigo-600/30 border border-indigo-400/30">
                <i data-lucide="maximize-2" class="w-4 h-4"></i>
                <span class="hidden sm:inline">全画面掲示モード</span>
                <span class="sm:hidden">全画面</span>
            </button>
        </div>
    </header>

    <!-- メインエリア -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-8">

        <!-- 1. ネームプレート表示（メインプレビュー） -->
        <section id="nameplate-section" class="flex flex-col items-center justify-center transition-all duration-300">
            <div class="w-full max-w-lg flex justify-between items-center mb-3 px-1">
                <span class="text-xs font-bold text-indigo-400 flex items-center gap-1.5 uppercase tracking-wider">
                    <i data-lucide="sparkles" class="w-4 h-4"></i> ネームプレート（完成イメージ）
                </span>
                <span id="update-badge" class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-0.5 rounded-full flex items-center gap-1 font-medium">
                    <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> 準備完了
                </span>
            </div>

            <!-- 名札カード（アバター除去＆名前中央強調） -->
            <div id="card-container" class="glass-card card-glow w-full max-w-lg rounded-3xl p-8 sm:p-12 flex flex-col justify-between items-center text-center relative overflow-hidden transition-all duration-300 min-h-[320px] sm:min-h-[360px]">
                
                <!-- 装飾背景グラデーション -->
                <div class="absolute inset-0 bg-gradient-to-tr from-indigo-600/10 via-purple-600/5 to-cyan-500/10 pointer-events-none"></div>
                <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

                <!-- 上部：所属 / 肩書き -->
                <div class="w-full z-10 space-y-2">
                    <p id="display-title" class="text-base sm:text-lg font-bold text-indigo-300 tracking-wider break-words">
                        参加者 / ゲスト
                    </p>
                    
                    <!-- 称号 / バッジ表示スロット（将来拡張用） -->
                    <div id="badge-slot" class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-slate-800/90 border border-amber-500/40 text-xs text-amber-300 font-bold shadow-md">
                        <i data-lucide="award" class="w-3.5 h-3.5 text-amber-400"></i>
                        <span id="display-badge">一般参加者</span>
                    </div>
                </div>

                <!-- 中央：名前（メイン超大文字・中央配置） -->
                <div class="my-auto py-8 z-10 w-full flex items-center justify-center">
                    <h2 id="display-name" class="text-4xl sm:text-5xl md:text-6xl font-black tracking-tight text-white break-words leading-tight drop-shadow-md">
                        山田 太郎
                    </h2>
                </div>

                <!-- 下部：フッター / イベント名 -->
                <div class="w-full z-10 border-t border-slate-700/60 pt-4 flex justify-between items-center text-xs text-slate-400 font-medium">
                    <span class="flex items-center gap-1.5 text-slate-300">
                        <i data-lucide="qr-code" class="w-4 h-4 text-indigo-400"></i> EVENT DISPLAY
                    </span>
                    <span class="text-[11px] text-slate-500">DIGITAL NAMEPLATE</span>
                </div>

            </div>

            <!-- 名札下部の案内 -->
            <p id="preview-hint" class="text-xs text-slate-400 mt-3 flex items-center gap-1.5">
                <i data-lucide="smartphone" class="w-4 h-4 text-indigo-400"></i> イベント会場では「全画面表示」ボタンを押して画面を全画面にできます
            </p>
        </section>


        <!-- 2. 全操作コントロールパネル（一画面で完結） -->
        <section id="form-section" class="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 sm:p-7 shadow-2xl space-y-6">
            
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <span class="p-2 rounded-xl bg-indigo-500/20 text-indigo-400">
                        <i data-lucide="edit-3" class="w-5 h-5"></i>
                    </span>
                    <h2 class="font-bold text-base sm:text-lg text-white">テキストの入力・操作</h2>
                </div>
                <span class="text-xs text-slate-400">入力すると即座に反映されます</span>
            </div>

            <!-- フォーム入力エリア -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                
                <!-- お名前入力 -->
                <div class="space-y-2">
                    <label for="input-name" class="block text-sm font-bold text-slate-200 flex items-center justify-between">
                        <span class="flex items-center gap-1.5">
                            <i data-lucide="user" class="w-4 h-4 text-indigo-400"></i>
                            お名前 / ニックネーム
                        </span>
                        <span class="text-rose-400 text-xs font-semibold">*必須</span>
                    </label>
                    <div class="relative">
                        <input type="text" id="input-name" value="山田 太郎" placeholder="例: 山田 太郎" 
                            class="w-full bg-slate-950 border-2 border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-slate-100 text-base font-bold focus:outline-none focus:ring-4 focus:ring-indigo-500/20 transition shadow-inner pr-12">
                        <button id="btn-clear-name" type="button" title="クリア" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition">
                            <i data-lucide="x-circle" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- 肩書き・所属入力 -->
                <div class="space-y-2">
                    <label for="input-title" class="block text-sm font-bold text-slate-200 flex items-center gap-1.5">
                        <i data-lucide="building-2" class="w-4 h-4 text-indigo-400"></i>
                        肩書き / 所属・コメント
                    </label>
                    <div class="relative">
                        <input type="text" id="input-title" value="参加者 / ゲスト" placeholder="例: Webエンジニア / ゲスト" 
                            class="w-full bg-slate-950 border-2 border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-slate-100 text-base font-medium focus:outline-none focus:ring-4 focus:ring-indigo-500/20 transition shadow-inner pr-12">
                        <button id="btn-clear-title" type="button" title="クリア" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition">
                            <i data-lucide="x-circle" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

            </div>

            <!-- 操作ボタン群 -->
            <div class="pt-3 flex flex-wrap items-center justify-between gap-3 border-t border-slate-800">
                <div class="flex items-center gap-3">
                    <button id="btn-apply" type="button" class="bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 active:scale-95 text-white font-bold text-sm px-6 py-3 rounded-xl transition flex items-center gap-2 shadow-lg shadow-indigo-600/30">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        <span>決定・反映する</span>
                    </button>
                    
                    <span id="toast-msg" class="text-xs text-emerald-400 font-bold opacity-0 transition-opacity duration-300 flex items-center gap-1">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> 反映しました！
                    </span>
                </div>

                <!-- 全画面表示切り替えボタン -->
                <button id="btn-fullscreen-main" type="button" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-100 font-bold text-sm px-5 py-3 rounded-xl border border-slate-700 transition flex items-center gap-2">
                    <i data-lucide="expand" class="w-4 h-4 text-indigo-400"></i>
                    <span>ネームプレートを全画面で掲示</span>
                </button>
            </div>

            <!-- 将来の拡張機能スロット表示 -->
            <div class="pt-2">
                <p class="text-xs font-semibold text-slate-500 mb-2">今後の拡張予定機能：</p>
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80 text-center">
                        <span class="block text-[10px] font-bold text-indigo-400">🚶 アバター移動</span>
                        <span class="text-[10px] text-slate-400">歩き回り演出</span>
                    </div>
                    <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80 text-center">
                        <span class="block text-[10px] font-bold text-indigo-400">🎨 テーマ変更</span>
                        <span class="text-[10px] text-slate-400">背景・デザイン切替</span>
                    </div>
                    <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80 text-center">
                        <span class="block text-[10px] font-bold text-indigo-400">🏆 称号システム</span>
                        <span class="text-[10px] text-slate-400">バッジ・称号設定</span>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <!-- 全画面掲示モード時の浮遊解除ボタン -->
    <button id="btn-exit-fullscreen" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 hover:bg-slate-800 border-2 border-indigo-500/60 text-slate-100 text-sm font-bold px-6 py-3.5 rounded-full shadow-2xl flex items-center gap-2 backdrop-blur active:scale-95 transition">
        <i data-lucide="minimize-2" class="w-4 h-4 text-indigo-400"></i> 全画面表示を解除する (ESC)
    </button>

    <!-- フッター -->
    <footer id="app-footer" class="w-full py-4 text-center text-xs text-slate-500 border-t border-slate-900">
        デジタルネームプレート Web App
    </footer>

    <script>
        // Lucideアイコン初期化
        lucide.createIcons();

        // DOM要素
        const inputName = document.getElementById('input-name');
        const inputTitle = document.getElementById('input-title');
        const displayName = document.getElementById('display-name');
        const displayTitle = document.getElementById('display-title');
        
        const btnClearName = document.getElementById('btn-clear-name');
        const btnClearTitle = document.getElementById('btn-clear-title');
        const btnApply = document.getElementById('btn-apply');
        const toastMsg = document.getElementById('toast-msg');

        const btnFullscreenHeader = document.getElementById('btn-fullscreen-header');
        const btnFullscreenMain = document.getElementById('btn-fullscreen-main');
        const btnExitFullscreen = document.getElementById('btn-exit-fullscreen');
        
        const appHeader = document.getElementById('app-header');
        const appFooter = document.getElementById('app-footer');
        const formSection = document.getElementById('form-section');
        const previewHint = document.getElementById('preview-hint');
        const cardContainer = document.getElementById('card-container');

        // 決定・反映時の視覚フィードバック
        function triggerUpdateFeedback() {
            toastMsg.classList.remove('opacity-0');
            setTimeout(() => {
                toastMsg.classList.add('opacity-0');
            }, 1800);

            cardContainer.classList.remove('animate-card-update');
            void cardContainer.offsetWidth; // リフロー
            cardContainer.classList.add('animate-card-update');
        }

        // 1. リアルタイムテキスト更新
        inputName.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            displayName.textContent = val || "（お名前）";
        });

        inputTitle.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            displayTitle.textContent = val || "（肩書き）";
        });

        // 2. クリアボタン機能
        btnClearName.addEventListener('click', () => {
            inputName.value = '';
            displayName.textContent = "（お名前）";
            inputName.focus();
        });

        btnClearTitle.addEventListener('click', () => {
            inputTitle.value = '';
            displayTitle.textContent = "（肩書き）";
            inputTitle.focus();
        });

        // 3. 決定ボタン
        btnApply.addEventListener('click', () => {
            triggerUpdateFeedback();
        });

        // 4. 全画面掲示モード切り替え
        let isFullscreen = false;

        function toggleFullscreen() {
            isFullscreen = !isFullscreen;

            if (isFullscreen) {
                appHeader.classList.add('hidden');
                appFooter.classList.add('hidden');
                formSection.classList.add('hidden');
                previewHint.classList.add('hidden');

                // カードを画面全体にフィットさせる
                cardContainer.classList.remove('max-w-lg', 'min-h-[320px]', 'sm:min-h-[360px]');
                cardContainer.classList.add('w-[94vw]', 'max-w-2xl', 'h-[85vh]', 'justify-center');

                btnExitFullscreen.classList.remove('hidden');
            } else {
                appHeader.classList.remove('hidden');
                appFooter.classList.remove('hidden');
                formSection.classList.remove('hidden');
                previewHint.classList.remove('hidden');

                // 通常サイズに戻す
                cardContainer.classList.add('max-w-lg', 'min-h-[320px]', 'sm:min-h-[360px]');
                cardContainer.classList.remove('w-[94vw]', 'max-w-2xl', 'h-[85vh]', 'justify-center');

                btnExitFullscreen.classList.add('hidden');
            }
        }

        btnFullscreenHeader.addEventListener('click', toggleFullscreen);
        btnFullscreenMain.addEventListener('click', toggleFullscreen);
        btnExitFullscreen.addEventListener('click', toggleFullscreen);

        // ESCキーで全画面解除
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isFullscreen) {
                toggleFullscreen();
            }
        });
    </script>
</body>
</html>
